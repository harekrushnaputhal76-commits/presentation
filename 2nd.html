<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Ride Pro - Passenger App Showcase</title>

    <!-- Premium Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* =========================================================
           1. RESPONSIVE FULLSCREEN CANVAS
           ========================================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #000000; font-family: 'Inter', sans-serif; color: #ffffff;
            display: flex; justify-content: center; align-items: center;
            width: 100vw; height: 100vh; overflow: hidden; 
        }

        .presentation-canvas {
            width: 100vw; height: 100vh; position: relative; overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #000000 80%);
        }

        .grid-bg {
            position: absolute; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px; z-index: 1; pointer-events: none;
        }

        /* =========================================================
           2. RESPONSIVE IPHONE MOCKUP
           ========================================================= */
        .phone-container {
            position: absolute; top: 48%; left: 50%; transform: translate(-50%, -50%);
            display: flex; justify-content: center; z-index: 20;
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
            height: 85vh; max-height: 800px; aspect-ratio: 1 / 2.1;
        }
        
        .iphone-frame {
            width: 100%; height: 100%; background: #000;
            border-radius: 45px; position: relative;
            box-shadow: 0 40px 80px rgba(0,0,0,0.9), inset 0 0 0 3px #444, inset 0 0 0 12px #000, 0 0 50px rgba(0, 229, 255, 0.15);
            display: flex; justify-content: center; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.15);
        }

        /* Hardware Buttons */
        .iphone-frame::before { content: ''; position: absolute; left: -2px; top: 20%; width: 2px; height: 10%; background: #555; box-shadow: 0 50px 0 #555; }
        .iphone-frame::after { content: ''; position: absolute; right: -2px; top: 25%; width: 2px; height: 12%; background: #555; }

        /* Dynamic Island */
        .dynamic-island {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            width: 30%; height: 28px; background: #000; border-radius: 20px; z-index: 50;
            box-shadow: inset 0 0 2px rgba(255,255,255,0.2);
        }

        /* Glass Reflection */
        .glass-glare { position: absolute; top: 0; left: 0; width: 150%; height: 100%; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,0.04) 45%, transparent 50%); z-index: 40; pointer-events: none; }

        /* =========================================================
           3. HOME PAGE UI REPLICA (Advanced Component Focus)
           ========================================================= */
        .screen { width: 100%; height: 100%; background: #f4f5f7; font-family: 'Outfit', sans-serif; position: relative; display: flex; flex-direction: column; }
        
        /* MICRO-FOCUS ENGINE CLASSES */
        .focusable { transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .screen.focus-active .focusable.dimmed { filter: blur(4px) grayscale(60%); opacity: 0.3; transform: scale(0.96); }
        
        /* Specific Highlights */
        .screen.focus-active .focusable.highlight { filter: none; opacity: 1; transform: scale(1.05); z-index: 30; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.15); border-radius: 20px; background: #fff; }
        
        /* Specific Service Highlight (Inside Grid) */
        .screen.focus-active .ui-service.highlight { transform: scale(1.15); box-shadow: 0 15px 30px rgba(0,0,0,0.2); padding: 5px; background: #fff; border-radius: 16px; z-index: 35; }

        /* UI Components */
        .ui-header { padding: 45px 15px 15px; display: flex; justify-content: space-between; align-items: center; background: #f4f5f7; border-bottom: 1px solid transparent; }
        .ui-header.highlight { border-bottom: 1px solid #e2e8f0; }
        .ui-user { display: flex; align-items: center; gap: 10px; }
        .ui-pic { width: 40px; height: 40px; background: #f8fafc; border-radius: 50%; border: 2px solid #cddb16; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 16px; }
        .ui-greet p { font-size: 10px; color: #64748b; font-weight: 500; }
        .ui-greet h2 { font-size: 16px; color: #0f172a; font-weight: 800; }
        .ui-bell { width: 32px; height: 32px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #0f172a; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        .ui-search-wrap { padding: 5px 15px 10px; }
        .ui-search { background: #fff; padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 10px; border: 1px solid #e2e8f0; }
        .ui-search i { color: #0f172a; font-size: 14px; }
        .ui-search span { flex-grow: 1; font-size: 14px; font-weight: 800; color: #0f172a; }

        .ui-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 5px 15px 15px; }
        .ui-service { display: flex; flex-direction: column; align-items: center; gap: 5px; transition: all 0.4s ease; }
        .ui-icon-box { width: 45px; height: 45px; border-radius: 14px; display: flex; justify-content: center; align-items: center; font-size: 18px; }
        .ui-service p { font-size: 11px; font-weight: 700; color: #0f172a; }

        .ui-bottom-content { padding: 0 15px; flex-grow: 1; overflow: hidden;}
        .ui-promo { background: linear-gradient(135deg, #1e293b, #0f172a); border-radius: 12px; padding: 12px; display: flex; justify-content: space-between; align-items: center; color: #fff; margin-bottom: 15px; }
        .ui-promo h3 { font-size: 14px; color: #cddb16; font-weight: 800; }
        .ui-promo p { font-size: 10px; opacity: 0.9; }

        .ui-nav { position: absolute; bottom: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 12px 10px 20px; border-top: 1px solid #e2e8f0; }
        .ui-nav-item { display: flex; flex-direction: column; align-items: center; color: #94a3b8; gap: 3px; }
        .ui-nav-item.active { color: #0f172a; }
        .ui-nav-item i { font-size: 18px; }
        .ui-nav-item p { font-size: 9px; font-weight: 800; }

        /* =========================================================
           4. DYNAMIC SUBTITLE BOX
           ========================================================= */
        .subtitle-box {
            position: absolute; bottom: 5vh; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 16px;
            padding: 20px 40px; font-size: 22px; font-weight: 500; color: #fff;
            text-align: center; z-index: 50; opacity: 0; transition: opacity 0.4s;
            max-width: 90%; width: 900px; box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            line-height: 1.5;
        }
        .highlight-text { color: #00e5ff; font-weight: 700; }
        .highlight-gold { color: #fbbf24; font-weight: 700; }
        .highlight-green { color: #00ff66; font-weight: 700; }
    </style>
</head>
<body>

    <div class="presentation-canvas">
        <div class="grid-bg"></div>

        <!-- RESPONSIVE IPHONE MOCKUP -->
        <div class="phone-container" id="phone">
            <div class="iphone-frame">
                <div class="dynamic-island"></div>
                <div class="glass-glare"></div>
                
                <!-- HOME PAGE UI REPLICA -->
                <div class="screen" id="app-screen">
                    
                    <div class="ui-header focusable" id="comp-header">
                        <div class="ui-user">
                            <div class="ui-pic"><i class="fa-solid fa-user"></i></div>
                            <div class="ui-greet"><p>Good Morning,</p><h2>Rider 👋</h2></div>
                        </div>
                        <div class="ui-bell"><i class="fa-regular fa-bell"></i></div>
                    </div>

                    <div class="ui-search-wrap focusable" id="comp-search">
                        <div class="ui-search">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <span>Where to?</span>
                        </div>
                    </div>

                    <!-- GRID SEPARATED INTO INDIVIDUAL FOCUSABLE ELEMENTS -->
                    <div class="ui-grid">
                        <div class="ui-service focusable" id="svc-ride"><div class="ui-icon-box" style="background:#e0f2fe; color:#0284c7;"><i class="fa-solid fa-car"></i></div><p>Ride</p></div>
                        <div class="ui-service focusable" id="svc-auto"><div class="ui-icon-box" style="background:#fef08a; color:#a16207;"><i class="fa-solid fa-truck-fast"></i></div><p>Auto</p></div>
                        <div class="ui-service focusable" id="svc-bike"><div class="ui-icon-box" style="background:#dcfce7; color:#166534;"><i class="fa-solid fa-motorcycle"></i></div><p>Bike</p></div>
                        <div class="ui-service focusable" id="svc-rentals"><div class="ui-icon-box" style="background:#ccfbf1; color:#0f766e;"><i class="fa-solid fa-key"></i></div><p>Rentals</p></div>
                        <div class="ui-service focusable" id="svc-parcel"><div class="ui-icon-box" style="background:#f3e8ff; color:#7e22ce;"><i class="fa-solid fa-box"></i></div><p>Parcel</p></div>
                        <div class="ui-service focusable" id="svc-outstation"><div class="ui-icon-box" style="background:#ffedd5; color:#c2410c;"><i class="fa-solid fa-map-location-dot"></i></div><p>Outstation</p></div>
                    </div>

                    <div class="ui-bottom-content focusable" id="comp-promo">
                        <div class="ui-promo">
                            <div><h3>Zero Surge Passes</h3><p>Subscribe for daily commute discounts</p></div>
                            <div style="font-size:24px;">🎟️</div>
                        </div>
                    </div>

                    <div class="ui-nav focusable" id="comp-nav">
                        <div class="ui-nav-item active"><i class="fa-solid fa-house"></i><p>Home</p></div>
                        <div class="ui-nav-item" id="nav-passes"><i class="fa-solid fa-ticket"></i><p>Passes</p></div>
                        <div class="ui-nav-item" id="nav-wallet"><i class="fa-solid fa-wallet"></i><p>Wallet</p></div>
                        <div class="ui-nav-item" id="nav-account"><i class="fa-solid fa-user"></i><p>Account</p></div>
                    </div>

                </div>
            </div>
        </div>

        <!-- DYNAMIC SUBTITLES -->
        <div class="subtitle-box" id="subtitle"></div>

    </div>

    <!-- JAVASCRIPT: AUTO-PLAY SYNC & MICRO-FOCUS ENGINE -->
    <script>
        let synth = window.speechSynthesis;
        let activeVoice = null;

        function loadVoices() {
            const voices = synth.getVoices();
            // Fetching a high-quality professional voice
            activeVoice = voices.find(v => v.name.includes('Premium') || v.name.includes('Google') || v.name.includes('Natural') || v.lang === 'en-US') || voices[0];
        }
        loadVoices();
        synth.onvoiceschanged = loadVoices;

        // --- THE ADVANCED SCRIPT (Deep Details, No Useless Talk) ---
        const segments = [
            { text: "Welcome to the Passenger Interface. Designed for seamless, multi-modal mobility.", focus: "none" },
            { text: "The unified search bar instantly connects you to the nearest available drivers.", focus: "comp-search" },
            
            // Micro-Focusing on Individual Services
            { text: "Choose <span class='highlight-text'>Ride</span> for premium, air-conditioned cabs driven by top-rated professionals.", focus: "svc-ride" },
            { text: "Select <span class='highlight-gold'>Auto</span> to beat city traffic with affordable, transparent pricing.", focus: "svc-auto" },
            { text: "Opt for <span class='highlight-green'>Bike</span> for quick, solo commutes at lightning speed.", focus: "svc-bike" },
            { text: "Or book <span class='highlight-text'>Rentals</span> to keep the car for your selected time, with flexible hourly packages.", focus: "svc-rentals" },
            { text: "We also offer secure <span class='highlight-text'>Parcel</span> deliveries and verified <span class='highlight-text'>Outstation</span> travel.", focus: "svc-parcel,svc-outstation" }, // Dual focus
            
            // Bottom Features
            { text: "Unlock <span class='highlight-text'>Zero-Surge Passes</span> to secure flat rates for your daily commutes.", focus: "comp-promo" },
            { text: "Manage 256-bit encrypted payments through the <span class='highlight-text'>Secure Wallet</span>.", focus: "comp-nav" },
            { text: "And configure your KYC, SOS, and preferences in the <span class='highlight-text'>Account Dashboard</span>.", focus: "comp-header" }
        ];

        let currentSegment = 0;

        function playNextSegment() {
            if (currentSegment >= segments.length) {
                // ENDING: Silently fade out and redirect to 3.html without saying anything
                document.getElementById('subtitle').style.opacity = '0';
                applyFocus('none'); // Reset view for a clean exit
                setTimeout(() => { window.location.href = '3.html'; }, 1500); // 1.5s cinematic pause before switching
                return;
            }

            const segment = segments[currentSegment];
            applyFocus(segment.focus);

            let speechText = segment.text.replace(/<[^>]*>?/gm, ''); // Clean HTML tags for speech engine

            const utterance = new SpeechSynthesisUtterance(speechText);
            utterance.rate = 1.03; // Professional, slightly energetic pacing
            utterance.pitch = 1.0;
            if (activeVoice) utterance.voice = activeVoice;
            
            const subBox = document.getElementById('subtitle');
            subBox.innerHTML = segment.text;
            subBox.style.opacity = '1';

            utterance.onend = () => {
                currentSegment++;
                setTimeout(playNextSegment, 500); // 500ms professional breath pause
            };

            // Safety Fallback if browser audio is completely disabled
            setTimeout(() => { if (!synth.speaking && currentSegment === 0) runVisualsOnly(); }, 1500);

            synth.speak(utterance);
        }

        // --- MICRO-FOCUS ENGINE ---
        function applyFocus(targetIds) {
            const screen = document.getElementById('app-screen');
            const allFocusables = document.querySelectorAll('.focusable');
            
            if (targetIds === "none") {
                screen.classList.remove('focus-active');
                allFocusables.forEach(el => {
                    el.classList.remove('highlight', 'dimmed');
                });
                document.getElementById('phone').style.transform = "translate(-50%, -50%) scale(1)";
            } else {
                screen.classList.add('focus-active');
                const targets = targetIds.split(','); // Allow multiple targets (e.g. Parcel & Outstation)
                
                allFocusables.forEach(el => {
                    if (targets.includes(el.id)) {
                        el.classList.add('highlight');
                        el.classList.remove('dimmed');
                    } else {
                        el.classList.remove('highlight');
                        el.classList.add('dimmed');
                    }
                });
                document.getElementById('phone').style.transform = "translate(-50%, -50%) scale(1.05)"; // Cinematic Zoom
            }
        }

        // --- AUTO-PLAY ON LOAD ---
        window.onload = () => {
            // Begins automatically 0.8 seconds after loading
            setTimeout(playNextSegment, 800);
        };

        // --- FALLBACK VISUALS (If audio blocked) ---
        function runVisualsOnly() {
            let i = 0;
            function nextVisual() {
                if (i >= segments.length) {
                    document.getElementById('subtitle').style.opacity = '0';
                    applyFocus('none');
                    setTimeout(() => { window.location.href = '3.html'; }, 1500);
                    return;
                }
                applyFocus(segments[i].focus);
                document.getElementById('subtitle').innerHTML = segments[i].text;
                document.getElementById('subtitle').style.opacity = '1';
                setTimeout(() => { i++; nextVisual(); }, 3500);
            }
            nextVisual();
        }
    </script>
</body>
</html>
